<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Primary Fusion Blue Metallic Surface Gradient -->
    <linearGradient id="fusionBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CB3F8" />
      <stop offset="25%" stop-color="#2196E3" />
      <stop offset="60%" stop-color="#0277BD" />
      <stop offset="85%" stop-color="#01579B" />
      <stop offset="100%" stop-color="#003967" />
    </linearGradient>

    <!-- Highlight Reflection Gradient along outer spine -->
    <linearGradient id="spineHighlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1F5FE" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#81D4FA" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#29B6F6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Solid End Face Gradient (Flat Orthographic Cut Look) -->
    <linearGradient id="cutFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80D8FF" />
      <stop offset="50%" stop-color="#40C4FF" />
      <stop offset="100%" stop-color="#0091EA" />
    </linearGradient>

    <!-- Inner Bore Shadow Gradient for Hollow Depth -->
    <radialGradient id="innerBoreShadow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#001827" />
      <stop offset="70%" stop-color="#002842" />
      <stop offset="100%" stop-color="#00395C" />
    </radialGradient>

    <!-- Clean CAD Drop Shadow -->
    <filter id="cadShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#001524" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#cadShadow)">
    <!-- Main Swept Tube Body (Straight Leg -> 90° Bend -> Straight Leg) -->
    <path d="
      M 110,380 
      L 110,230 
      C 110,163.7 163.7,110 230,110 
      L 380,110 
      L 380,190 
      L 230,190 
      C 207.9,190 190,207.9 190,230 
      L 190,380 
      Z"
      fill="url(#fusionBodyGrad)"
      stroke="#002947"
      stroke-width="3"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Outer Bend Highlight Specular Line -->
    <path d="
      M 116,375 
      L 116,230 
      C 116,167 167,116 230,116 
      L 375,116"
      fill="none"
      stroke="url(#spineHighlightGrad)"
      stroke-width="5"
      stroke-linecap="round"
    />

    <!-- Secondary Soft Inner Fillet Light Accent -->
    <path d="
      M 184,375 
      L 184,230 
      C 184,204.6 204.6,184 230,184 
      L 375,184"
      fill="none"
      stroke="#4FC3F7"
      stroke-width="2"
      stroke-opacity="0.6"
    />

    <!-- Right Cut Face (Horizontal Tube End) -->
    <g>
      <!-- Outer Rim Face -->
      <path d="M 380,110 A 40,40 0 0,1 380,190 Z" fill="url(#cutFaceGrad)" stroke="#002947" stroke-width="3" />
      <ellipse cx="380" cy="150" rx="15" ry="40" fill="url(#cutFaceGrad)" stroke="#002947" stroke-width="3" />
      <!-- Hollow Hole Bore -->
      <ellipse cx="380" cy="150" rx="9" ry="26" fill="url(#innerBoreShadow)" stroke="#001827" stroke-width="2" />
    </g>

    <!-- Bottom Cut Face (Vertical Tube End) -->
    <g>
      <!-- Outer Rim Face -->
      <ellipse cx="150" cy="380" rx="40" ry="15" fill="url(#cutFaceGrad)" stroke="#002947" stroke-width="3" />
      <!-- Hollow Hole Bore -->
      <ellipse cx="150" cy="380" rx="26" ry="9" fill="url(#innerBoreShadow)" stroke="#001827" stroke-width="2" />
    </g>
  </g>
</svg>